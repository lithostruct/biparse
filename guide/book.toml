[book]
title = "Biparse Documentation"
authors = ["lithostruct"]
language = "en"

[rust]
edition = "2024"

[preprocessor.rustdoc-links]
after = ["links"]
build.toolchain = "1.99.0"
build.packages = [
  "biparse",
  "either",
  "logos",
  "rowan",
  "regex",
  "regex-lite",
]
build.preludes = [
  "biparse::*",
  "biparse::prelude::*",
]

[output.html]
mathjax-support = true
playground.runnable = false

[output.linkcheck2]
follow-web-links = false
traverse-parent-directories = true
warning-policy = "error"