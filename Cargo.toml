[package]
name = "biparse"
version = "0.1.0"
edition = "2024"

[features]
default = ["regex", "logos"]
regex = ["dep:regex", "dep:regex-lite"]
logos = ["dep:logos"]

[dependencies]
derive_more = { version = "2.1.1", features = ["from", "into", "display", "deref", "deref_mut", "as_ref"] }
hashbrown = "0.17.1"
im = "15.1.0"
rowan = "0.17.0"
rustc-hash = "2.1.3"
thiserror = "2.0.20"
either = "1.18.0"
ptree = {version = "0.5.2", default-features = false, features = ["ansi"]}
indent = "0.1.1"

# Optional dependenceies
regex = {version = "1.13.1", optional = true}
regex-lite = {version = "0.1.9", optional = true}
logos = {version = "0.16.1", optional = true}
arcstr = "1.2.0"

[dev-dependencies]
expect-test = "1.5.1"
indoc = "2.0.7"
num-bigint = "0.5.1"
num-derive = "0.5.1"
num-traits = "0.2.19"
proptest = "1.11.0"

[lints.rust]
missing_docs = "warn"

[package.metadata.mdbook]
targets = [
    "guide",
]